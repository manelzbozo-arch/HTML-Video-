<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Splits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 1080px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 920px;
      padding: 60px 0;
    }

    h1 {
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 48px;
    }

    .header-row {
      display: flex;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1.5px solid #333;
      margin-bottom: 32px;
    }

    .col-km  { width: 80px; font-size: 24px; color: #bbb; }
    .col-pace { width: 140px; font-size: 24px; color: #bbb; }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .km-label   { width: 80px;  font-size: 30px; color: #ccc; }
    .pace-label { width: 140px; font-size: 30px; font-weight: 600; }

    .bar-track {
      flex: 1;
      height: 52px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: #4a7fe8;
      border-radius: 8px;
      width: 0%;
      transition: width 0s;
    }

    .bar.animate {
      transition: width 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Splits</h1>

    <div class="header-row">
      <span class="col-km">Km</span>
      <span class="col-pace">Pace</span>
    </div>

    <div id="rows"></div>
  </div>

  <script>
    const splits = [
      { km: 1, pace: "6:17", seconds: 377 },
      { km: 2, pace: "5:34", seconds: 334 },
      { km: 3, pace: "5:25", seconds: 325 },
      { km: 4, pace: "4:30", seconds: 270 },
      { km: 5, pace: "4:14", seconds: 254 },
      { km: 6, pace: "4:08", seconds: 248 },
      { km: 7, pace: "3:58", seconds: 238 },
    ];

    const minSeconds = Math.min(...splits.map(s => s.seconds));
    const maxSeconds = Math.max(...splits.map(s => s.seconds));

    const MIN_BAR = 20;
    const MAX_BAR = 92;

    function barWidth(seconds) {
      const speed = 1 / seconds;
      const speedMin = 1 / maxSeconds;
      const speedMax = 1 / minSeconds;
      const t = (speed - speedMin) / (speedMax - speedMin);
      return MIN_BAR + t * (MAX_BAR - MIN_BAR);
    }

    const container = document.getElementById("rows");

    splits.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="km-label">${s.km}</span>
        <span class="pace-label">${s.pace}</span>
        <div class="bar-track">
          <div class="bar" id="bar-${i}" data-width="${barWidth(s.seconds).toFixed(2)}"></div>
        </div>
      `;
      container.appendChild(row);
    });

    // Trigger animations with staggered delay
    window.startAnimation = function() {
      splits.forEach((_, i) => {
        const bar = document.getElementById(`bar-${i}`);
        setTimeout(() => {
          bar.classList.add("animate");
          bar.style.width = bar.dataset.width + "%";
        }, i * 140);
      });
    };

    // Auto-start after a short delay (for video capture)
    setTimeout(window.startAnimation, 600);
  </script>
</body>
</html>
